<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="icon" data-artifact-build="favicon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2252%22%20font-size%3D%2276%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%3E%C2%B6%3C%2Ftext%3E%3C%2Fsvg%3E">
  <style data-artifact-build="reset">
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd { margin: 0; }
    img, picture, svg, video, canvas { display: block; max-width: 100%; }
    input, button, textarea, select { font: inherit; }
  </style>
<style>/*CSS*/</style></head><body>
<a class="skip" href="#main">Skip to comparison</a>
<header class="topbar row spread"><div class="brand">¶ &nbsp; Persona Comparison <span>{{kind}}</span></div><div class="row"><span class="status" id="save-status" role="status">Selections sync automatically</span><button data-action="theme">Change theme</button><button id="save-button" class="primary" data-action="save">Sync now</button></div></header>
<div class="shell"><section class="intro"><div><div class="eyebrow">{{eyebrow}}</div><h1 style="margin-top:10px">{{title}}</h1><p>{{description}}</p></div><span class="chip" id="selection-count">No selections</span></section>
<nav class="tabs" aria-label="Dashboard views"><button data-action="view" data-view="approaches">01 &nbsp; Approaches</button><button data-action="view" data-view="compare">02 &nbsp; Compare drafts</button><button data-action="view" data-view="selection">03 &nbsp; Your selection <span id="saved-count">0</span></button><button data-action="view" data-view="baseline">Source artifact</button></nav>
<main id="main" tabindex="-1"></main>
<footer class="bottom-note row spread"><span>Selections autosave locally for Codex to read. Export is an optional backup; applying changes remains a separate step.</span><button class="link" data-action="reset">Reset choices</button></footer></div>
<div id="toast" class="toast" role="status" hidden></div>
<script>/*APP*/</script></body></html>
